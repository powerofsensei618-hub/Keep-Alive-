<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Render Keep Alive</title>
</head>
<body>
  <h3>i love you ❤️</h3>

  <script>
    const url = "https://learnwithpw-recordedms-v2.onrender.com";

    setInterval(() => {
      fetch(url)
        .then(() => console.log("Ping sent"))
        .catch(() => console.log("Ping failed"));
    }, 240000); // 4 minutes
  </script>
</body>
</html>
